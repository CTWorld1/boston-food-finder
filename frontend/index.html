<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Boston Food Finder</title>

    <link
        rel="stylesheet"
        href="./styles.css?v=2"
    >
</head>

<body>

    <main class="page">

        <!-- Decorative corner artwork -->
        <div class="corner-decoration left-decoration">
            <span>♨</span>
        </div>

        <div class="corner-decoration right-decoration">
            <span>📍</span>
        </div>


        <!-- Header -->
        <header class="hero">

            <div class="hero-icon">
                🍴
            </div>

            <h1>Boston Food Finder</h1>

            <p>
                Discover great restaurants by cuisine and location.
            </p>

        </header>


        <!-- Search Bar -->
        <section class="search-bar">

            <div class="search-field">
                <span class="field-icon">🍴</span>

                <input
                    id="cuisineInput"
                    type="text"
                    placeholder="Cuisine, e.g. Chinese"
                    autocomplete="off"
                >
            </div>


            <div class="search-field">
                <span class="field-icon">📍</span>

                <input
                    id="locationInput"
                    type="text"
                    placeholder="Location, e.g. Boston, MA"
                    autocomplete="off"
                >
            </div>


            <div class="search-field small-field">
                <span class="field-icon">↔</span>

                <input
                    id="milesInput"
                    type="number"
                    value="5"
                    min="0.1"
                    max="50"
                    step="0.1"
                    placeholder="Miles"
                >
            </div>


            <div class="search-field small-field">
                <span class="field-icon">#</span>

                <input
                    id="limitInput"
                    type="number"
                    value="10"
                    min="1"
                    max="20"
                    placeholder="Results"
                >
            </div>


            <button
                id="searchButton"
                type="button"
            >
                <span class="search-icon">⌕</span>
                Find Restaurants
            </button>

        </section>


        <!-- Result Status -->
        <section
            id="statusContainer"
            class="status-container hidden"
        >
            <span
                id="statusIcon"
                class="status-icon"
            >
                ✓
            </span>

            <span id="status"></span>
        </section>


        <!-- Loading -->
        <section
            id="loading"
            class="loading hidden"
        >
            <div class="spinner"></div>

            <p>Finding restaurants...</p>
        </section>


        <!-- Restaurant cards go here -->
        <section
            id="results"
            class="results-grid"
        ></section>


        <!-- Bottom decoration -->
        <footer class="footer-message">

            <div class="skyline">
                🏙️
            </div>

            <div class="footer-text">
                Good food
                <br>
                brings people together.
            </div>

        </footer>

    </main>

    <script src="./app.js?v=2"></script>

</body>

</html>
